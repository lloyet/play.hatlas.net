# Faction home command settings for /faction home
faction_home:
  cooldown_seconds: 30
  teleport_delay_seconds: 10

# Skill points earned per faction level-up (default: 1).
# Increase to reward players with more points per level.
skill_points_per_level: 1

# Skill upgrade prices — each entry is a purchasable tier that faction members
# can buy via the Atlas Crystal skill GUI, spending faction skill points.
#
# hp        — adds permanent HP to the crystal           (bonus: hearts, cost: SP)
# claims    — increases the crystal's claim capacity     (amount: chunks, cost: SP)
# chest     — unlocks a faction chest on the crystal     (size: 27 or 54, cost: SP)
# protection — adds to the crystal's immunity duration on defeat (minutes, cost: SP)
skills:
  hp:
    - bonus: 20
      cost: 1
    - bonus: 50
      cost: 2
    - bonus: 100
      cost: 3
    - bonus: 200
      cost: 5
  claims:
    - amount: 3
      cost: 3
    - amount: 5
      cost: 4
    - amount: 10
      cost: 6
  chest:
    - size: 9
      cost: 1
    - size: 27
      cost: 2
    - size: 54
      cost: 3
  protection:
    - minutes: 30
      cost: 1
    - minutes: 60
      cost: 2
    - minutes: 120
      cost: 4
    - minutes: 240
      cost: 6
    - minutes: 480
      cost: 10
  outpost:
    cost: 15

# Atlas Crystal settings
crystal:
  # HP regenerated per second when the crystal has not been attacked for regen_timeout_seconds.
  regen_per_second: 1.5
  # Base immunity in seconds granted when a crystal is defeated.
  # Subsequent defeats within the escalation window multiply this by immunity_multiplier.
  immunity_base_seconds: 180
  # Escalation multiplier applied each time the crystal is defeated within the active window.
  immunity_multiplier: 2
  # Seconds of inactivity (no damage received) before a crystal starts regenerating HP.
  regen_timeout_seconds: 30
