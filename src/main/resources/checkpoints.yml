# Atlas Crystal checkpoint levels and their max HP bonus.
# When a faction reaches a checkpoint level, an Owner or Leader can run
# /faction checkpoint apply <crystalName> to permanently increase that crystal's max HP.
# Checkpoint levels: 1, 3, 5, 9, 21, 42, 58, 64, 81, 97, 100
checkpoints:
  - level: 1
    bonus_hp: 20
  - level: 3
    bonus_hp: 30
  - level: 5
    bonus_hp: 40
  - level: 9
    bonus_hp: 60
  - level: 21
    bonus_hp: 80
  - level: 42
    bonus_hp: 120
  - level: 58
    bonus_hp: 160
  - level: 64
    bonus_hp: 200
  - level: 81
    bonus_hp: 250
  - level: 97
    bonus_hp: 320
  - level: 100
    bonus_hp: 400
