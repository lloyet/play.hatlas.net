# ------------------------------------------------------------
# Shops
# ------------------------------------------------------------
# Managed with /shop create | delete | additem, but can be edited by hand (then restart).
# A hand-written shop with an `npc` location but no `uuid` gets its NPC spawned on startup.
#
# shops:
#   miner_shop:
#     job: MINER
#     npc: { world: world, x: 0.5, y: 64.0, z: 0.5, yaw: 0.0, pitch: 0.0 }
#     common: { ... entries ... }
#     rare:   { ... entries ... }
shops: {}
