# ============================================================
# Job Shop System
# ============================================================
# Every shop is a villager NPC tied to one job. Right-clicking it (faction required)
# opens a menu with two sub-shops:
#   - Common: any faction member who has a job (whatever the job) can buy.
#   - Rare:   only faction members whose job matches the shop's job can buy.
# Prices are in ruby gems, taken from the buyer's inventory.

# How often (in hours) every shop restocks: its common and rare selections are
# re-drawn at random from the pools below, using each entry's weight.
# 168 = one week.
reset_interval_hours: 168

# How many items are on sale at once in each sub-shop (max 28).
# If a pool has fewer entries, all of them are on sale.
items_per_shop:
  common: 12
  rare: 12

# ------------------------------------------------------------
# Item entry format
# ------------------------------------------------------------
#   <entry_id>:
#     name: "Label"        # shown in the shop GUI (optional, defaults to the material name)
#     material: IRON_PICKAXE
#     amount: 1            # optional, default 1
#     price: 8             # in ruby
#     weight: 40           # higher = more likely to be picked at each restock (0 = never)
#     potion: healing      # optional, for POTION / SPLASH_POTION / LINGERING_POTION / TIPPED_ARROW
#     enchantments:        # optional; on ENCHANTED_BOOK these become stored enchantments
#       efficiency: 3
#
# Entries added in-game with /shop additem store the exact held item under `item:`
# instead of `material:` (keeps custom names, lore, enchantments, …).

# ------------------------------------------------------------
# Default pools per job
