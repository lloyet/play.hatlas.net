                  level: 3
                - enchantment: mending
                  level: 1
                - enchantment: thorns
                  level: 3
            - material: DRAGON_EGG
              amount: 1
              chance: 0.10

# ============================================================
# Quest System
# Tasks are combined randomly into dynamic daily quests.
# A quest is generated when the player opens the daily quest NPC menu.
# Only tasks whose min_level <= faction_level <= max_level are eligible.
#
# Task fields:
#   id              — unique identifier (used internally)
#   job             — job this task belongs to (miner, lumberjack, hunter, farmer)
#   name            — display name shown in inventory
#   description     — short task description
#   action_type     — event category: break_block | kill_entity | harvest_crop
#   min_level       — minimum faction level required to receive this task
#   max_level       — maximum faction level at which this task can appear
#   difficulty      — 1=easy, 2=normal, 3=hard (affects exp formula)
#   time_limit_seconds — seconds until a quest containing this task auto-expires
#   targets         — list of relevant block/entity names for the action type
#   item_rewards    — list of { material, amount } given on completion
#
# Exp reward formula (applied once per quest, not per task):
#   exp = exp_base_reward * sum(task difficulties) * sqrt(faction_level + 1)
# ============================================================
quests:
  # Base XP multiplier used in the quest exp formula.
  exp_base_reward: 10

  tasks:
    # ── Miner ────────────────────────────────────────────────────────────────
    - id: mine_coal
      job: miner
      name: "Coal Runner"
      description: "Supply coal to keep the furnaces burning."
      action_type: break_block
      min_level: 0
      max_level: 20
      difficulty: 1
      time_limit_seconds: 2400
      targets:
        - COAL_ORE
        - DEEPSLATE_COAL_ORE
      item_rewards:
        - material: COAL
          amount: 32

    - id: mine_iron
      job: miner
      name: "Iron Gatherer"
      description: "Gather iron for the faction's forge."
      action_type: break_block
      min_level: 0
      max_level: 40
      difficulty: 1
      time_limit_seconds: 3600
      targets:
        - IRON_ORE
        - DEEPSLATE_IRON_ORE
      item_rewards:
        - material: IRON_INGOT
          amount: 16

    - id: mine_redstone
      job: miner
      name: "Redstone Engineer"
      description: "Collect redstone for the faction engineers."
      action_type: break_block
      min_level: 5
      max_level: 50
      difficulty: 2
      time_limit_seconds: 3600
      targets:
        - REDSTONE_ORE
        - DEEPSLATE_REDSTONE_ORE
      item_rewards:
        - material: REDSTONE
          amount: 32

    - id: mine_gold
      job: miner
      name: "Gold Rush"
      description: "Mine gold to fund faction trade."
      action_type: break_block
      min_level: 10
      max_level: 60
      difficulty: 2
      time_limit_seconds: 5400
      targets:
        - GOLD_ORE
        - DEEPSLATE_GOLD_ORE
        - NETHER_GOLD_ORE
      item_rewards:
        - material: GOLD_INGOT
          amount: 12

    - id: mine_diamond
      job: miner
      name: "Diamond Hunt"
      description: "Venture deep and bring back diamonds."
      action_type: break_block
      min_level: 20
      max_level: 100
      difficulty: 3
      time_limit_seconds: 7200
      targets:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      item_rewards:
        - material: DIAMOND
          amount: 3

    - id: mine_ancient_debris
      job: miner
      name: "Nether Excavation"
      description: "Brave the Nether and recover ancient debris."
      action_type: break_block
      min_level: 50
      max_level: 100
      difficulty: 3
      time_limit_seconds: 7200
      targets:
        - ANCIENT_DEBRIS
      item_rewards:
        - material: NETHERITE_SCRAP
          amount: 1

    # ── Lumberjack ───────────────────────────────────────────────────────────
    - id: chop_oak
      job: lumberjack
      name: "Oak Supplier"
      description: "Chop oak logs for the faction stockpile."
      action_type: break_block
      min_level: 0
      max_level: 30
      difficulty: 1
      time_limit_seconds: 2400
      targets:
        - OAK_LOG
      item_rewards:
        - material: OAK_LOG
          amount: 32

    - id: chop_birch
      job: lumberjack
      name: "Birch Harvester"
      description: "Harvest birch logs for construction."
      action_type: break_block
      min_level: 0
      max_level: 30
      difficulty: 1
      time_limit_seconds: 2400
      targets:
        - BIRCH_LOG
      item_rewards:
        - material: BIRCH_LOG
          amount: 32

    - id: chop_spruce
      job: lumberjack
      name: "Spruce Logging"
      description: "Cut spruce logs for the faction's needs."
      action_type: break_block
      min_level: 0
      max_level: 40
      difficulty: 1
      time_limit_seconds: 2400
      targets:
        - SPRUCE_LOG
      item_rewards:
        - material: SPRUCE_LOG
          amount: 32

    - id: chop_jungle
      job: lumberjack
      name: "Jungle Expedition"
      description: "Harvest jungle wood from the deep forest."
      action_type: break_block
      min_level: 10
      max_level: 60
      difficulty: 2
