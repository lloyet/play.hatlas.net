# ============================================================
# Quest System
# Tasks are combined randomly into dynamic daily quests.
# Difficulty (1–4), amount, time limit, and item reward amounts are all
# generated at runtime — they are NOT configurable here.
#
# Task fields:
#   id              — unique identifier (used internally)
#   job             — job this task belongs to (miner, lumberjack, hunter, farmer)
#   name            — display name shown in inventory
#   description     — short task description
#   action_type     — event category: break_block | kill_entity | harvest_crop
#   targets         — list of relevant block/entity names for the action type
#   item_rewards    — list of { material } to reward on completion
#                     (amounts are computed at runtime: ≤30% of gather count, scaled by level)
#
# All tasks are eligible regardless of player level.
# Exp reward formula (applied once per quest, not per task):
#   exp = exp_base_reward * sum(task difficulties) * sqrt(faction_level + 1)
# ============================================================
quests:
  # Base XP multiplier used in the quest exp formula.
  exp_base_reward: 10

  tasks:
    # ── Miner ────────────────────────────────────────────────────────────────
    - id: mine_coal
      job: miner
      name: "Coal Runner"
      description: "Supply coal to keep the furnaces burning."
      action_type: break_block
      targets:
        - COAL_ORE
        - DEEPSLATE_COAL_ORE
      item_rewards:
        - material: COAL

    - id: mine_iron
      job: miner
      name: "Iron Gatherer"
      description: "Gather iron for the faction's forge."
      action_type: break_block
      targets:
        - IRON_ORE
        - DEEPSLATE_IRON_ORE
      item_rewards:
        - material: IRON_INGOT

    - id: mine_redstone
      job: miner
      name: "Redstone Engineer"
      description: "Collect redstone for the faction engineers."
      action_type: break_block
      targets:
        - REDSTONE_ORE
        - DEEPSLATE_REDSTONE_ORE
      item_rewards:
        - material: REDSTONE

    - id: mine_gold
      job: miner
      name: "Gold Rush"
      description: "Mine gold to fund faction trade."
      action_type: break_block
      targets:
        - GOLD_ORE
        - DEEPSLATE_GOLD_ORE
        - NETHER_GOLD_ORE
      item_rewards:
        - material: GOLD_INGOT

    - id: mine_diamond
      job: miner
      name: "Diamond Hunt"
      description: "Venture deep and bring back diamonds."
      action_type: break_block
      targets:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      item_rewards:
        - material: DIAMOND

    - id: mine_ancient_debris
      job: miner
      name: "Nether Excavation"
      description: "Brave the Nether and recover ancient debris."
      action_type: break_block
      targets:
        - ANCIENT_DEBRIS
      item_rewards:
        - material: NETHERITE_INGOT

    # ── Lumberjack ───────────────────────────────────────────────────────────
    - id: chop_oak
      job: lumberjack
      name: "Oak Supplier"
      description: "Chop oak logs for the faction stockpile."
      action_type: break_block
      targets:
        - OAK_LOG
      item_rewards:
        - material: OAK_LOG

    - id: chop_birch
      job: lumberjack
      name: "Birch Harvester"
      description: "Harvest birch logs for construction."
      action_type: break_block
      targets:
        - BIRCH_LOG
      item_rewards:
        - material: BIRCH_LOG

    - id: chop_spruce
      job: lumberjack
      name: "Spruce Logging"
      description: "Cut spruce logs for the faction's needs."
      action_type: break_block
      targets:
        - SPRUCE_LOG
      item_rewards:
        - material: SPRUCE_LOG

    - id: chop_jungle
      job: lumberjack
      name: "Jungle Expedition"
      description: "Harvest jungle wood from the deep forest."
      action_type: break_block
      targets:
        - JUNGLE_LOG
      item_rewards:
        - material: JUNGLE_LOG

    - id: chop_dark_oak
      job: lumberjack
      name: "Dark Oak Lumbering"
      description: "Fell dark oak for premium lumber."
      action_type: break_block
      targets:
        - DARK_OAK_LOG
      item_rewards:
        - material: DARK_OAK_LOG

    - id: chop_crimson
      job: lumberjack
      name: "Nether Forester"
      description: "Harvest crimson and warped stems from the Nether."
      action_type: break_block
      targets:
        - CRIMSON_STEM
        - WARPED_STEM
      item_rewards:
        - material: CRIMSON_STEM
        - material: WARPED_STEM

    # ── Hunter ───────────────────────────────────────────────────────────────
    - id: hunt_zombies
      job: hunter
      name: "Undead Slayer"
      description: "Eliminate zombies threatening the faction."
      action_type: kill_entity
      targets:
        - ZOMBIE
        - HUSK
      item_rewards:
        - material: ROTTEN_FLESH

    - id: hunt_skeletons
      job: hunter
      name: "Bone Collector"
      description: "Defeat skeletons and collect their bones."
      action_type: kill_entity
      targets:
        - SKELETON
        - STRAY
      item_rewards:
        - material: BONE
        - material: ARROW

    - id: hunt_spiders
      job: hunter
      name: "Web Clearer"
      description: "Hunt spiders and bring back their silk."
      action_type: kill_entity
      targets:
        - SPIDER
        - CAVE_SPIDER
      item_rewards:
        - material: STRING

    - id: hunt_creepers
      job: hunter
      name: "Creeper Hunter"
      description: "Take down creepers before they cause damage."
      action_type: kill_entity
      targets:
        - CREEPER
      item_rewards:
        - material: GUNPOWDER

    - id: hunt_endermen
      job: hunter
      name: "Void Walker"
      description: "Hunt endermen for their pearls."
      action_type: kill_entity
      targets:
        - ENDERMAN
      item_rewards:
        - material: ENDER_PEARL

    - id: hunt_blazes
      job: hunter
      name: "Blaze Extinguisher"
      description: "Defeat blazes and retrieve their rods."
      action_type: kill_entity
      targets:
        - BLAZE
      item_rewards:
        - material: BLAZE_ROD

    # ── Farmer ───────────────────────────────────────────────────────────────
    - id: farm_wheat
      job: farmer
      name: "Wheat Harvest"
      description: "Harvest wheat to feed the faction."
      action_type: harvest_crop
      targets:
        - WHEAT
      item_rewards:
        - material: BREAD

    - id: farm_carrots
      job: farmer
      name: "Carrot Crop"
      description: "Grow and harvest carrots for the storehouse."
      action_type: harvest_crop
      targets:
        - CARROTS
      item_rewards:
        - material: CARROT

    - id: farm_potatoes
      job: farmer
      name: "Potato Supply"
      description: "Harvest potatoes to sustain the faction."
      action_type: harvest_crop
      targets:
        - POTATOES
      item_rewards:
        - material: BAKED_POTATO

    - id: farm_beetroot
      job: farmer
      name: "Beetroot Harvest"
      description: "Collect beetroot for faction recipes."
      action_type: harvest_crop
      targets:
        - BEETROOTS
      item_rewards:
        - material: BEETROOT

    - id: farm_melon
      job: farmer
      name: "Melon Patch"
      description: "Harvest melons from the faction garden."
      action_type: harvest_crop
      targets:
        - MELON
      item_rewards:
        - material: MELON_SLICE

    - id: farm_nether_wart
      job: farmer
      name: "Nether Alchemist"
      description: "Harvest nether wart for the faction's potions."
      action_type: harvest_crop
      targets:
        - NETHER_WART
      item_rewards:
        - material: NETHER_WART

    # ── Alchemist ─────────────────────────────────────────────────────────────
    - id: brew_potions
      job: alchemist
      name: "Potion Brewer"
      description: "Brew potions at a brewing stand."
      action_type: brew_potion
      targets:
        - POTION
        - SPLASH_POTION
        - LINGERING_POTION
      item_rewards:
        - material: GLASS_BOTTLE

    - id: craft_golden_items
      job: alchemist
      name: "Golden Crafter"
      description: "Craft golden food items used in potions."
      action_type: craft_item
      targets:
        - GOLDEN_CARROT
        - GOLDEN_APPLE
      item_rewards:
        - material: GOLD_NUGGET

    - id: craft_potion_ingredients
      job: alchemist
      name: "Ingredient Gatherer"
      description: "Craft essential alchemical ingredients."
      action_type: craft_item
      targets:
        - SUGAR
        - BLAZE_POWDER
        - MAGMA_CREAM
        - FERMENTED_SPIDER_EYE
      item_rewards:
        - material: NETHER_WART

    - id: craft_tipped_arrows
      job: alchemist
      name: "Arrow Infuser"
      description: "Craft tipped arrows for the faction."
      action_type: craft_item
      targets:
        - TIPPED_ARROW
      item_rewards:
        - material: ARROW

    - id: hunt_nether_alchemist
      job: alchemist
      name: "Nether Hunter"
      description: "Hunt nether creatures for alchemical components."
      action_type: kill_entity
      targets:
        - BLAZE
        - GHAST
        - WITHER_SKELETON
        - MAGMA_CUBE
      item_rewards:
        - material: BLAZE_ROD

# ============================================================
# Jokeyrini — the wandering trader of challenges.
# Tasks combine into one daily quest with 2–3 tasks at Hard/Hardcore
# difficulty. Reward: 1–2 Donjon Keys (based on max difficulty reached).
#
# Task fields are the same as regular quest tasks.
# item_rewards should be left empty — the donjon key is always given
# automatically on completion.
# ============================================================
jokeyrini:
  special_quest_chance: 0.15
  tasks:
    - id: jok_nether_slayer
      name: "Nether Slayer"
      description: "Exterminate the most dangerous Nether mobs."
      action_type: kill_entity
      targets:
        - BLAZE
        - GHAST
        - WITHER_SKELETON
        - PIGLIN_BRUTE
      item_rewards: []

    - id: jok_ancient_miner
      name: "Ancient Miner"
      description: "Excavate ancient debris deep in the Nether."
      action_type: break_block
      targets:
        - ANCIENT_DEBRIS
      item_rewards: []

    - id: jok_master_brewer
      name: "Master Brewer"
      description: "Brew potent lingering or splash potions."
      action_type: brew_potion
      targets:
        - LINGERING_POTION
        - SPLASH_POTION
      item_rewards: []

    - id: jok_golden_crafter
      name: "Golden Artisan"
      description: "Craft powerful golden items."
      action_type: craft_item
      targets:
        - GOLDEN_APPLE
        - GOLDEN_CARROT
      item_rewards: []

    - id: jok_diamond_miner
      name: "Diamond Seeker"
      description: "Mine diamonds from the deep."
      action_type: break_block
      targets:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      item_rewards: []

