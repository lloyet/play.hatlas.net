# Atlas plugin configuration
# Factions and claims are persisted here automatically on server shutdown.
factions: {}
claims: {}

# Atlas Crystal settings
crystal:
  # HP regenerated per second when the crystal has not been attacked for regen_timeout_seconds.
  regen_per_second: 1.5
  # Duration in seconds that a crystal is immune to damage after a checkpoint level drop.
  immunity_duration_seconds: 3600
  # Seconds of inactivity (no damage received) before a crystal starts regenerating HP.
  regen_timeout_seconds: 60

# Faction level checkpoint configuration.
# When a faction reaches a checkpoint level, an Owner or Leader can run
# /faction checkpoint apply <crystalName> to permanently increase that crystal's max HP.
checkpoints:
  - level: 1
    bonus_hp: 20
  - level: 3
    bonus_hp: 30
  - level: 5
    bonus_hp: 40
  - level: 9
    bonus_hp: 60
  - level: 21
    bonus_hp: 80
  - level: 42
    bonus_hp: 120
  - level: 58
    bonus_hp: 160
  - level: 64
    bonus_hp: 200
  - level: 81
    bonus_hp: 250
  - level: 97
    bonus_hp: 320
  - level: 100
    bonus_hp: 400
