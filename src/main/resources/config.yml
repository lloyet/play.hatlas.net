        - DARK_OAK_LOG
      item_rewards:
        - material: DARK_OAK_LOG
          amount: 24

    - id: chop_crimson
      job: lumberjack
      name: "Nether Forester"
      description: "Harvest crimson and warped stems from the Nether."
      action_type: break_block
      min_level: 40
