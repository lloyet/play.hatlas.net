# Atlas plugin configuration
# See also: factions.yml, donjons.yml, jobs.yml, tags.yml

# Persisted at runtime — do not edit manually.
# spawn: set via /setspawn in-game
player_homes: { }

# Spawn protection: players cannot PvP while either of them is within this radius of world spawn.
spawn_protection:
  pvp_radius: 64

# Personal home command settings for /home
home_teleport:
  # Cooldown in seconds after a successful /home teleport
  cooldown_seconds: 300

# Teleport-to-player settings for /tpa
tpa:
  # Cooldown in seconds after a completed /tpa teleport
  cooldown_seconds: 60

# Spawn command settings for /spawn
spawn_teleport:
  # Cooldown in seconds after a successful teleport to spawn
  cooldown_seconds: 30

# Random teleport settings for /air tp
random_teleport:
  # Cooldown in seconds between uses
  cooldown_seconds: 30
  # Maximum distance in blocks from world spawn for the random destination
  radius: 1024
