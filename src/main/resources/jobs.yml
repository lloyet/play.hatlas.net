# ============================================================
# Jokeyrini — the wandering trader of challenges.
# ============================================================
jokeyrini:
  special_quest_chance: 0.15
  tasks:
    - id: jok_nether_slayer
      name: Nether Slayer
      description: Exterminate the most dangerous Nether mobs.
      action_type: kill_entity
      targets:
        - BLAZE
        - GHAST
        - WITHER_SKELETON
        - PIGLIN_BRUTE
      item_rewards: []
    - id: jok_ancient_miner
      name: Ancient Miner
      description: Excavate ancient debris deep in the Nether.
      action_type: break_block
      targets:
        - ANCIENT_DEBRIS
      item_rewards: []
    - id: jok_master_brewer
      name: Master Brewer
      description: Brew potent lingering or splash potions.
      action_type: brew_potion
      targets:
        - LINGERING_POTION
        - SPLASH_POTION
      item_rewards: []
    - id: jok_golden_crafter
      name: Golden Artisan
      description: Craft powerful golden items.
      action_type: craft_item
      targets:
        - GOLDEN_APPLE
        - GOLDEN_CARROT
      item_rewards: []
    - id: jok_diamond_miner
      name: Diamond Seeker
      description: Mine diamonds from the deep.
      action_type: break_block
      targets:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      item_rewards: []
