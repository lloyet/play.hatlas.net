# ============================================================
# Quest System
# Tasks are combined randomly into dynamic daily quests.
# ============================================================
quests:
  # Base XP multiplier used in the quest exp formula.
  exp_base_reward: 10

  tasks:
    - id: mine_coal
      job: miner
      name: Coal Runner
      description: Supply coal to keep the furnaces burning.
      action_type: break_block
      targets:
        - COAL_ORE
        - DEEPSLATE_COAL_ORE
      item_rewards:
        - material: COAL
    - id: mine_iron
      job: miner
      name: Iron Gatherer
      description: Gather iron for the faction's forge.
      action_type: break_block
      targets:
        - IRON_ORE
        - DEEPSLATE_IRON_ORE
      item_rewards:
        - material: IRON_INGOT
    - id: mine_redstone
      job: miner
      name: Redstone Engineer
      description: Collect redstone for the faction engineers.
      action_type: break_block
      targets:
        - REDSTONE_ORE
        - DEEPSLATE_REDSTONE_ORE
      item_rewards:
        - material: REDSTONE
    - id: mine_gold
      job: miner
      name: Gold Rush
      description: Mine gold to fund faction trade.
      action_type: break_block
      targets:
        - GOLD_ORE
        - DEEPSLATE_GOLD_ORE
        - NETHER_GOLD_ORE
      item_rewards:
        - material: GOLD_INGOT
    - id: mine_diamond
      job: miner
      name: Diamond Hunt
      description: Venture deep and bring back diamonds.
      action_type: break_block
      targets:
